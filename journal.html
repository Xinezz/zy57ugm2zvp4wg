<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daily Reflection</title>
<link rel="icon" href="assets/notes-icon.gif" type="image/gif">
<link rel="preload" href="assets/fonts/PatrickHand-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#14110a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/life.css">
<link rel="stylesheet" href="css/journal.css">
<script src="js/theme.js"></script>
<script src="js/loader.js"></script>
</head>
<body>

<div class="loader" id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <img class="loader-icon" src="assets/notes-icon.gif" alt="">
  <div class="loader-title">Loading</div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div class="loader-pct">0%</div>
  <div class="loader-tip">Tip: star your best day each week and it becomes the highlight of your recap.</div>
</div>
<noscript><style>.loader { display: none; }</style></noscript>

<main class="page">
  <div class="page-head">
    <div>
      <h1>Daily Reflection</h1>
      <p class="page-sub" id="streakText">Look back on your day in four questions.</p>
    </div>
    <div class="day-switch">
      <button type="button" class="chip" id="prevDay" aria-label="Previous day">&#9664;</button>
      <input type="date" class="field" id="dayPicker" aria-label="Choose a day">
      <button type="button" class="chip" id="nextDay" aria-label="Next day">&#9654;</button>
      <button type="button" class="chip" id="todayBtn">Today</button>
    </div>
  </div>

  <div class="journal-layout">
    <section class="card journal-card" aria-labelledby="entryHeading">
      <h2 class="card-title" id="entryHeading"><span id="entryDate">Today</span><span class="save-state" id="saveState" aria-live="polite"></span></h2>

      <label class="label">What did I accomplish today?
        <textarea class="field" id="accomplished" maxlength="2000" placeholder="Big or small, it counts."></textarea>
      </label>
      <label class="label">What did I learn?
        <textarea class="field" id="learned" maxlength="2000" placeholder="A concept, a trick, something about yourself..."></textarea>
      </label>
      <label class="label">What went wrong, and how can I improve?
        <textarea class="field" id="wrong" maxlength="2000" placeholder="Be kind but honest."></textarea>
      </label>
      <label class="label">What is the most important thing tomorrow?
        <textarea class="field" id="tomorrow" maxlength="600" placeholder="One thing that would make tomorrow a win."></textarea>
      </label>
      <div class="btn-row">
        <button type="button" class="chip" id="toTasks">Add to tomorrow's tasks</button>
      </div>

      <div class="mood-row">
        <span class="muted">How was the day?</span>
        <div class="moods" id="moods" role="group" aria-label="Mood"></div>
      </div>

      <label class="highlight-row">
        <input type="checkbox" id="highlight">
        <span>Star this day as a highlight of the week</span>
      </label>
    </section>

    <aside class="journal-side">
      <section class="card">
        <h2 class="card-title">That day's tasks</h2>
        <ul class="list" id="dayTasks"></ul>
      </section>

      <section class="card">
        <h2 class="card-title">Recent entries</h2>
        <ul class="list" id="recent"></ul>
      </section>
    </aside>
  </div>

  <section class="card recap" aria-labelledby="recapHeading">
    <h2 class="card-title" id="recapHeading">
      <span>Weekly recap</span>
      <span class="day-switch small">
        <button type="button" class="chip" id="prevWeek" aria-label="Previous week">&#9664;</button>
        <span id="weekLabel" class="muted"></span>
        <button type="button" class="chip" id="nextWeek" aria-label="Next week">&#9654;</button>
      </span>
    </h2>
    <div id="recapBody"></div>
  </section>
</main>

<script src="js/ui-sound.js"></script>
<script src="js/shared.js"></script>
<script src="js/planner-core.js"></script>
<script src="js/life-core.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/journal.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sync-core.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
